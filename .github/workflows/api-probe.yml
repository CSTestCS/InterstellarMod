# Temporary helper: prints the public API of the Minecraft/NeoForge classes Interstellar uses (javap),
# so the code can be checked against the exact 26.3 signatures. Safe to delete.
name: API probe

on:
  push:
    paths:
      - tools/api-probe.txt
      - .github/workflows/api-probe.yml
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
      - name: Create Minecraft artifacts
        run: ./gradlew createMinecraftArtifacts --console=plain || ./gradlew compileJava --console=plain || true
      - name: Dump signatures
        run: |
          JAR=$(find build ~/.gradle -path '*moddev*' -name '*.jar' 2>/dev/null | grep -iE 'neoforge.*(merged|minecraft|client)|minecraft-joined|-sources' -v | head -0)
          ls -la build/moddev/artifacts/ || true
          CP=$(find build/moddev/artifacts -name '*.jar' ! -name '*sources*' | tr '\n' ':')
          CP="$CP$(find ~/.gradle/caches/modules-2 -name '*.jar' \( -path '*fml*' -o -path '*neoforged*' -o -path '*mojang*' \) | tr '\n' ':')"
          while read -r cls; do
            [ -z "$cls" ] && continue
            echo "===== $cls"
            javap -public -cp "$CP" "$cls" 2>&1 | grep -v '^Compiled from' | sed 's/^/API| /'
          done < tools/api-probe.txt
