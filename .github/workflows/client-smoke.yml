# Temporary helper: creates a world with mobs, opens it in the client with software rendering, and prints Interstellar-related log lines and errors.
name: Client smoke test

on:
  push:
    paths:
      - .github/workflows/client-smoke.yml
      - src/main/java/com/cstestcs/interstellar/client/**
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install software OpenGL
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libgl1-mesa-dri libglx-mesa0 libegl-mesa0 libegl1 libgl1 > /dev/null
      - name: Create a test world with mobs at spawn
        run: |
          # Test-only functions, written here and never committed: summon mobs at spawn, then save and stop.
          F=src/main/resources/data/interstellar/function; T=src/main/resources/data/minecraft/tags/function
          mkdir -p $F $T
          {
            echo "time set 14000"
            for id in minecraft:zombie minecraft:villager minecraft:skeleton minecraft:pillager minecraft:piglin interstellar:alien; do
              echo "summon $id ~2 ~ ~3 {PersistenceRequired:1b,NoAI:1b}"
              echo "summon $id ~-2 ~ ~3 {PersistenceRequired:1b,NoAI:1b}"
            done
            echo "say smoke: mobs summoned"
            echo "schedule function interstellar:smoke_stop 100t"
          } > $F/smoke_setup.mcfunction
          printf 'say smoke: stopping\nsave-all flush\nstop\n' > $F/smoke_stop.mcfunction
          echo '{"values":["interstellar:smoke_setup"]}' > $T/load.json
          mkdir -p run && echo "eula=true" > run/eula.txt
          printf "level-type=minecraft\\:normal\nonline-mode=false\nspawn-protection=0\nfunction-permission-level=4\n" > run/server.properties
          timeout 400 ./gradlew runServer --console=plain > server.log 2>&1 || true
          grep -nE "smoke:|Summoned|Unknown|Incorrect|ERROR|Exception|Done \\(" server.log | cut -c1-300 | head -40
          rm -rf $F/smoke_setup.mcfunction $F/smoke_stop.mcfunction $T
          mkdir -p run/saves && cp -r run/world run/saves/smoke && rm -rf run/world
      - name: Run client in the test world
        run: |
          export LIBGL_ALWAYS_SOFTWARE=1 SDL_VIDEODRIVER=offscreen
          ( sleep 200; for n in 1 2; do pid=$(pgrep -f devlaunch.Main | head -1); [ -n "$pid" ] && jstack -l $pid > jstack$n.txt; sleep 60; done ) &
          timeout 400 ./gradlew runClient -PquickPlay=smoke --console=plain > client.log 2>&1 || true
          for n in 1 2; do
            echo "===== thread dump $n: render/server/worker threads"
            python3 -c "import re,sys;t=open(sys.argv[1]).read().split(chr(10)+chr(10));print(chr(10).join(b[:6000] for b in t if re.search(r'Render thread|Server thread|interstellar|Worker-Main|modloading', b)))" jstack$n.txt 2>/dev/null | head -250 || true
          done
          echo "===== interesting lines"
          grep -nE "interstellar|Interstellar|ERROR|Exception|Caused by|[Mm]ixin|FATAL|crash|Crash|Preparing|logged in|joined|Loaded [0-9]+ (races|custom)" client.log | grep -vE "DEBUG|flite|Narrator|OpenAL|SoundSystem" | cut -c1-400 | head -200
          echo "===== tail"
          tail -60 client.log | cut -c1-400
          echo "===== crash reports"
          cat run/crash-reports/*.txt 2>/dev/null | head -150 || true
