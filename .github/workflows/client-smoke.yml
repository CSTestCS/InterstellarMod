# Temporary helper: launches the client under a virtual display and prints Interstellar-related log lines and errors.
name: Client smoke test

on:
  push:
    paths:
      - .github/workflows/client-smoke.yml
      - src/main/java/com/cstestcs/interstellar/client/**
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install virtual display
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb mesa-utils libgl1-mesa-dri > /dev/null
      - name: Run client
        run: |
          export LIBGL_ALWAYS_SOFTWARE=1
          timeout 420 xvfb-run -a -s "-screen 0 1280x720x24" ./gradlew runClient --console=plain > client.log 2>&1 || true
          echo "===== interesting lines"
          grep -nE "interstellar|Interstellar|ERROR|Exception|Caused by|[Mm]ixin|FATAL|Failed|crash|Crash" client.log | grep -vE "DEBUG" | head -300
          echo "===== tail"
          tail -80 client.log
          echo "===== crash reports"
          cat run/crash-reports/*.txt 2>/dev/null | head -150 || true
