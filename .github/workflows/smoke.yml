# Temporary helper: boots a dedicated server with the mod and prints Interstellar-related log lines and errors.
name: Server smoke test

on:
  push:
    paths:
      - .github/workflows/smoke.yml
      - smoke.trigger
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
      - name: Run server
        run: |
          mkdir -p run && echo "eula=true" > run/eula.txt
          printf "level-type=minecraft\\:normal\nonline-mode=false\n" > run/server.properties
          ( sleep 200; echo "interstellar ship list"; sleep 5; echo "stop" ) | timeout 600 ./gradlew runServer --console=plain > server.log 2>&1 || true
          echo "===== interesting lines"
          grep -nE "interstellar|Interstellar|ERROR|Exception|Caused by|Mixin|mixin|FATAL|Failed|failed|Done \(" server.log | grep -vE "DEBUG.*REGISTRIES" | head -400
          echo "===== tail"
          tail -60 server.log
          echo "===== race files"
          ls run/config/interstellar/races | head -20 || true
          ls run/config/interstellar/races | wc -l || true
